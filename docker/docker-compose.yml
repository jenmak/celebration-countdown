name: celebrationcountdown-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: celebrationcountdown
    ports:
      - '5433:5432'
    volumes:
      - ./.dev_data:/var/lib/postgresql/data
